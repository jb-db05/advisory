[project]
name = "syz-technical-takes"
version = "0.1.0"
description = "Syz Research 'Technical Takes' — a ticker into the three-page A4 technical-analysis PDF (verdict box with implied-target levels, price/stochastic/relative-strength chart, a breakout & momentum signal page, disclaimer). Pulls daily OHLC itself and synthesizes every Bloomberg indicator column, including the decoded %DS/%DSS stochastic."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1.0",      # read/write the Bloomberg-equivalent workbook
    "requests>=2.31.0",     # the OHLC feed
    "matplotlib>=3.8",      # the two price/signal charts
    "weasyprint>=60",       # HTML/CSS -> the 3-page A4 PDF
    "cairosvg>=2.7",        # hero motif SVG -> PNG
    "fonttools>=4.40",      # instance Nunito Sans static weights
]

[project.scripts]
syz-tt = "syz_technical_takes.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts/syz_technical_takes"]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
